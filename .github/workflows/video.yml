name: video

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install tooling + deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest numpy opencv-python-headless==4.11.0.86

      - name: Ruff
        run: ruff check edgescope/video/metrics.py tests/test_video/test_units.py

      - name: Pytest (unit only)
        run: pytest tests/test_video/test_units.py
